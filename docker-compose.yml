services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rie_db
      POSTGRES_USER: rie_user
      POSTGRES_PASSWORD: rie_password
    ports:
      - "5432:5432"
    volumes:
      - rie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rie_user -d rie_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rie_user:rie_password@db:5432/rie_db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  rie_pgdata: