version: '3.8'

services:
  # PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:pg18
    container_name: rie_postgres
    environment:
      POSTGRES_USER: rie_user
      POSTGRES_PASSWORD: rie_password
      POSTGRES_DB: rule_intelligence_engine
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - rie_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rie_user -d rule_intelligence_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rie_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - rie_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rie_api
    environment:
      DATABASE_URL: postgresql://rie_user:rie_password@db:5432/rule_intelligence_engine
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      ENV: production
      # JWT signing key (Spec §10.1). Required — the app refuses to start with
      # the insecure development default when ENV=production. Set it in .env
      # (gitignored) or export it before `docker compose up`.
      RIE_JWT_SECRET: ${RIE_JWT_SECRET:?RIE_JWT_SECRET must be set (see .env.example)}
      # API rate limiting (Spec §10.3): feedback=100/h, batch=10/h, rules=20/h,
      # reviews=200/h. Overridable per bucket via RIE_RATE_<BUCKET> and the
      # window via RIE_RATE_WINDOW so deployments can tune without code changes.
      RIE_RATE_WINDOW: ${RIE_RATE_WINDOW:-3600}
      RIE_RATE_AUTH: ${RIE_RATE_AUTH:-30}
      RIE_RATE_FEEDBACK: ${RIE_RATE_FEEDBACK:-100}
      RIE_RATE_BATCH: ${RIE_RATE_BATCH:-10}
      RIE_RATE_RULES: ${RIE_RATE_RULES:-20}
      RIE_RATE_REVIEWS: ${RIE_RATE_REVIEWS:-200}
      # Spec §10.10 Error Tracking: Sentry is opt-in — set RIE_SENTRY_DSN (or
      # SENTRY_DSN) to forward unhandled exceptions. No DSN -> disabled.
      RIE_SENTRY_DSN: ${RIE_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Structured JSON logging (Spec §10.10): RIE_LOG_FORMAT=json rewrites the
      # root logger formatters to emit one JSON object per line.
      RIE_LOG_FORMAT: ${RIE_LOG_FORMAT:-}
    volumes:
      - ./app:/app/app
      - ./app/static:/app/app/static
      - ./rie_ml:/app/rie_ml
      - ./logs:/app/logs
      - ./rie_ml/models:/app/rie_ml/models
      - ./results:/app/results
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rie_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Celery Worker (Background Tasks)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rie_celery_worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: postgresql://rie_user:rie_password@db:5432/rule_intelligence_engine
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      RIE_ENABLE_REAL_TRAINING: ${RIE_ENABLE_REAL_TRAINING:-false}
      # Spec §10.10 Error Tracking: Sentry is opt-in — set RIE_SENTRY_DSN (or
      # SENTRY_DSN) to forward unhandled exceptions. No DSN -> disabled.
      RIE_SENTRY_DSN: ${RIE_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Structured JSON logging (Spec §10.10): RIE_LOG_FORMAT=json rewrites the
      # root logger formatters to emit one JSON object per line.
      RIE_LOG_FORMAT: ${RIE_LOG_FORMAT:-}
    volumes:
      - ./app:/app/app
      - ./rie_ml:/app/rie_ml
    depends_on:
      - db
      - redis
      - api
    networks:
      - rie_network
    command: celery -A app.tasks worker --loglevel=info
    restart: unless-stopped

  # Prometheus metrics server (Spec §10.10 Monitoring). Optional — the API
  # exposes /metrics regardless; this just scrapes it. Disable by removing
  # the service (or setting RIE_PROMETHEUS_ENABLED=false and skipping the
  # `up` here) for deployments that don't want an extra container.
  prometheus:
    image: prom/prometheus:latest
    container_name: rie_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus/"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rie_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Grafana dashboards (Spec §10.10 Monitoring). Optional companion to
  # Prometheus; points at the same datasource and ships the RIE dashboard.
  grafana:
    image: grafana/grafana:latest
    container_name: rie_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - rie_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rie_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - rie_network
    restart: unless-stopped

networks:
  rie_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
